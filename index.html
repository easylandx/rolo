<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoloPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f0b823;--ink:#2b2418;--m:clamp(8px,2.5vw,18px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Courier Prime',monospace;color:var(--ink);background:radial-gradient(circle at 50% 0,#fffdf3,#fbf0cf 55%,#f5e1a2);padding:max(22px,env(safe-area-inset-top)) clamp(16px,5vw,48px) 48px}
.wrap{max-width:720px;margin:0 auto}
h1{font:400 clamp(28px,6vw,40px) 'Special Elite',serif;text-align:left}
h1 span{color:#c8921a}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand h1 a{color:inherit;text-decoration:none}.logo{display:block;flex:none;line-height:0}.logo img{width:clamp(34px,9vw,44px);height:auto;border-radius:22%;display:block;box-shadow:0 2px 0 rgba(110,80,10,.25)}.logo:focus-visible,.brand h1 a:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.sub{text-align:left;font-size:13px;opacity:.7;margin:2px 0 16px}
.search{display:flex;align-items:center;gap:10px;background:#fffaf0;border:2px solid #e3c36a;border-radius:999px;padding:2px 16px;margin-bottom:38px;box-shadow:0 3px 0 #e3c36a}
.search input{flex:1;min-width:0;border:0;background:none;font:16px 'Courier Prime',monospace;padding:10px 0;outline:0;color:var(--ink)}
#count{font-size:13px;white-space:nowrap;opacity:.7}
.device{display:grid;grid-template-columns:auto 1fr auto;column-gap:clamp(6px,2vw,14px);background:linear-gradient(#2b2b2e,#19191b);padding-top:12px;border-radius:22px 22px 14px 14px;box-shadow:0 18px 30px rgba(110,80,10,.3),inset 0 1px 0 #55555a}
.rail{display:flex;flex-direction:column;gap:3px;background:#0e0e0f;padding:6px;border-radius:10px;width:clamp(32px,9vw,42px);height:340px}
.rail.lf{margin-left:var(--m)}.rail.rg{margin-right:var(--m)}
.key{flex:1;min-height:0;border:0;border-radius:3px;background:#262628;color:#fff;font:700 clamp(11px,3vw,14px) Arial,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 #444}
.key.off{color:#68686d}.key.on{background:var(--gold);color:#1d1d1f}.key:active{transform:translateY(1px)}
.key:focus-visible,.b:focus-visible,.nav:focus-visible,.ping:focus-visible,.pull:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stage{position:relative}
.itab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);min-width:120px;text-align:center;background:var(--gold);color:#1d1d1f;font:700 15px Arial,sans-serif;padding:5px 18px 4px;border-radius:10px 10px 0 0;z-index:1}
.stack{position:relative;height:340px;perspective:900px;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.card{position:absolute;inset:0 0 36px 0;z-index:2;background:var(--cb,#fbf0c4);border-radius:6px 6px 3px 3px;padding:14px 16px 40px;transform-origin:top;box-shadow:0 2px 0 var(--cs1,#d9bd5a),0 -3px 0 var(--cs2,#ecd98c);background-image:linear-gradient(transparent 25px,var(--cl,#e6b72f) 25px);background-size:100% 26px;background-origin:content-box;overflow:hidden;font-size:clamp(13px,3.6vw,16px);line-height:26px}
.edge{position:absolute;left:0;right:0;bottom:0;height:42px;background:repeating-linear-gradient(var(--ce1,#f6e9ab) 0 3px,var(--ce2,#d8b94c) 3px 4px);border-radius:0 0 4px 4px}
.pull{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:84px;height:28px;border:0;border-radius:8px;background:linear-gradient(#383838,#111);box-shadow:0 3px 0 #000,inset 0 1px 0 #555;cursor:pointer;z-index:3}
.pull:active{transform:translateX(-50%) translateY(2px)}
.nm{font:400 clamp(20px,5.5vw,25px)/26px 'Special Elite',serif;color:#1d5fd1;white-space:normal;overflow-wrap:anywhere}
.r{height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r i{font-style:normal;opacity:.55;margin-right:8px;font-size:.8em}
.nt{max-height:78px;overflow:hidden;white-space:pre-wrap}
.base{grid-column:1/-1;margin-top:14px;background:linear-gradient(#141415,#0b0b0c);border-radius:0 0 14px 14px;padding:14px 12px 16px;display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,12px)}
.nav{width:clamp(40px,11vw,50px);height:clamp(40px,11vw,50px);flex:none;border-radius:12px;border:0;background:linear-gradient(#4a4a4e,#2c2c2f);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #000}
.ping{flex:0 1 300px;min-height:52px;border:0;border-radius:14px;background:linear-gradient(#3fc97a,#1f9a52);color:#fff;font:700 clamp(12px,3.4vw,15px) 'Courier Prime',monospace;letter-spacing:.05em;cursor:pointer;box-shadow:0 5px 0 #0f5f31,inset 0 2px 0 #8ef0b3}
.nav{padding:0;-webkit-appearance:none;appearance:none}.call,.mail{display:grid;place-items:center;flex:none}.nav svg{display:block;width:24px;height:24px;min-width:24px;pointer-events:none}.nav svg path{fill:#fff}.call{background:linear-gradient(#3fa9f5,#1f78c8);box-shadow:0 4px 0 #0e4a80}.mail{background:linear-gradient(#f5a43f,#d9771a);box-shadow:0 4px 0 #8a4a0c}.nav,.pull{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.nav:active{transform:translateY(4px);box-shadow:0 0 0 #000}
.ping:active{transform:translateY(4px);box-shadow:0 1px 0 #0f5f31,inset 0 2px 0 #8ef0b3}
.base{flex-direction:column;gap:12px}.brow{display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,12px);width:100%}.b.g{background:#3fc97a;border-color:#1f9a52;color:#fff;box-shadow:0 3px 0 #1f9a52}.b.g:active{box-shadow:none}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.b{font:700 14px 'Courier Prime',monospace;padding:10px 16px;border-radius:12px;border:2px solid #d9b247;background:#fff7dc;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #d9b247}
.b.p,.b[aria-pressed=true]{background:var(--gold)}.b:active{transform:translateY(3px);box-shadow:none}
.dz{display:block;margin-top:20px;border:2px dashed #d9b247;border-radius:14px;padding:18px;text-align:center;background:rgba(255,250,235,.75);cursor:pointer;font-size:14px}
.dz.hot{background:#fde9a3}.dz input{display:none}
.cc{margin-top:14px;text-align:center;font-size:13px}.cc input{width:70px;font:16px 'Courier Prime',monospace;padding:5px 8px;border:2px solid #e3c36a;border-radius:8px;background:#fff;margin-left:6px;color:var(--ink)}
dialog{margin:auto;border:3px solid #e3b94a;border-radius:16px;background:#fffaf0;color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px));font-family:'Courier Prime',monospace}
dialog::backdrop{background:rgba(150,110,20,.35);backdrop-filter:blur(2px)}
dialog h2{font:400 22px 'Special Elite',serif;margin-bottom:10px}
.sq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 6px;font-size:12px}.sq[hidden]{display:none}.sq>span{flex:1 0 100%}.sq .b{display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;font-size:12px;min-height:0;white-space:nowrap}.sq .b svg{width:16px;height:16px;flex:none}.sq a,.sl a{color:inherit}.sl a{text-decoration:underline;text-underline-offset:2px;cursor:pointer}
label.f{display:block;font-size:12px;letter-spacing:.04em;margin:9px 0 3px}
.t{width:100%;font:16px 'Courier Prime',monospace;padding:9px 10px;border:2px solid #e3c36a;border-radius:8px;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.fb{position:relative;flex:none;display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;padding:0}.fb svg{width:18px;height:18px}.fb[aria-expanded=true],.fb.on{background:var(--gold)}.fb i{position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:8px;background:var(--ink);color:#fff;font:700 10px/15px 'Courier Prime',monospace;text-align:center;font-style:normal}.fb i[hidden]{display:none}.fl{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 30px}.fl[hidden]{display:none}.fl .b{font-size:12px;padding:6px 12px;box-shadow:0 2px 0 #d9b247}.fl .b[aria-pressed=true]{background:var(--gold);box-shadow:inset 0 2px 0 rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips .b{font-size:12px;padding:6px 10px;box-shadow:0 2px 0 #d9b247}
#dk .hint{margin:4px 0}.bkl{display:grid;gap:10px;margin-top:12px}.bkl .b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}.bkl small{font:400 12px 'Courier Prime',monospace;opacity:.75}
#dh{width:min(520px,calc(100vw - 32px));max-height:86vh;overflow:auto}#dh h3{font:700 14px 'Courier Prime',monospace;margin:14px 0 4px}#dh ol{padding-left:20px;font-size:13px;line-height:1.5}#dh li{margin:4px 0}
#dh pre.code{margin:6px 0 8px;padding:10px 12px;background:#2b2418;color:#fbf0c4;border-radius:10px;font:12px/1.45 'Courier Prime',monospace;max-height:200px;overflow:auto;white-space:pre}#dh .cp{font-size:12px;padding:6px 12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#fff7c9;border:2px solid #d9b247;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:calc(100vw - 32px);font-size:14px}
#toast.s{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.hint{font-size:12px;opacity:.7;margin-top:8px;line-height:1.4}
.lang{display:flex;flex:none}
.lang .seg{display:inline-flex;gap:2px;background:#fffaf0;border:2px solid #e3c36a;border-radius:999px;padding:3px;box-shadow:0 3px 0 #e3c36a}
.lang button{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:5px 10px;border-radius:999px;font:700 13px 'Courier Prime',monospace;color:var(--ink);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold)}
.lang svg{width:22px;height:15px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.card{overflow:hidden auto;scrollbar-width:thin;scrollbar-color:#d9b247 transparent;background-attachment:local,scroll}
.nt{max-height:none}
.r.x{height:auto;white-space:normal;overflow:visible;overflow-wrap:anywhere;text-overflow:clip}
.device{position:relative}
.device.covered{background:none;box-shadow:none}.device.covered>*:not(.cover){visibility:hidden}

<script type="text/plain" id="fbcode">
(() => {
  const seen = new Set(), rows = [['Name', 'Profile URL']];
  document.querySelectorAll('a[href*="facebook.com"]').forEach(a => {
    const name = a.innerText.trim(), baseUrl = a.href.split('?')[0];
    const isProfile = a.href.includes('profile.php?id=') || /^https:\/\/(www\.)?facebook\.com\/[a-zA-Z0-9.]+\/?$/.test(baseUrl);
    const ignored = ['friends','photos','videos','groups','events','marketplace','watch','gaming','bookmarks','messages','notifications','settings','help'];
    const slug = baseUrl.replace(/\/$/, '').split('/').pop().toLowerCase();
    if (name.length > 1 && !name.includes('\n') && isProfile && !ignored.includes(slug)) {
      const cleanUrl = a.href.includes('profile.php?id=') ? a.href.split('&')[0] : baseUrl;
      if (!seen.has(cleanUrl)) { seen.add(cleanUrl); rows.push([`"${name.replace(/"/g, '""')}"`, `"${cleanUrl}"`]); }
    }
  });
  const link = Object.assign(document.createElement("a"), { href: encodeURI("data:text/csv;charset=utf-8,\uFEFF" + rows.map(e => e.join(",")).join("\n")), download: "facebook_friends_urls.csv" });
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
})();
</script>

function openWA(n,msg){

    const fell=setTimeout(()=>{if(!document.hidden)location.href=`https://wa.me/${n}?text=${enc}`},1500);
    document.addEventListener('visibilitychange',function once(){if(document.hidden){clearTimeout(fell);document.removeEventListener('visibilitychange',once)}});

  if(!w)location.href=u;
}

const APP_URL='https://easylandx.github.io/rolo';
let invBlob=null,invFile=null,invP=null;
function prepInvite(){
  if(invP)return invP;
  invP=fetch(INVITE_IMG).then(r=>r.blob()).then(b=>createImageBitmap(b)).then(bm=>{
    const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
    return new Promise((ok,ko)=>c.toBlob(x=>x?ok(x):ko(),'image/png'));
  }).then(png=>{invBlob=png;try{invFile=new File([png],'rolopro.png',{type:'image/png'})}catch(e){}return png});
  invP.catch(()=>{});return invP;
}
setTimeout(prepInvite,700);
async function inviteWA(){
  const msg=t('invMsg')+'\n'+APP_URL,u='https://wa.me/?text='+encodeURIComponent(msg);
  if(!invFile){try{await prepInvite()}catch(e){}}
  if(isMobile&&invFile&&navigator.share&&navigator.canShare&&navigator.canShare({files:[invFile]})){
    try{await navigator.share({files:[invFile],text:msg});return}catch(e){if(e&&e.name==='AbortError')return}}
  let wrote=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
      const pr=invBlob?Promise.resolve(invBlob):prepInvite();
      navigator.clipboard.write([new ClipboardItem({'image/png':pr})]).then(()=>toast(t(isMobile?'copiedM':'copied'),6000)).catch(()=>toast(t('copyFail'),6000));
      wrote=true}
  }catch(e){}
  if(!wrote)toast(t('noCopy'),6000);
  if(isMobile){setTimeout(()=>{location.href=u},700)}
  else{const wu='https://web.whatsapp.com/send?text='+encodeURIComponent(msg),w=window.open(wu,'_blank');try{if(w)w.opener=null}catch(e){}if(!w)location.href=wu}
}
$('inv').onclick=inviteWA;
let shareBlob=null,shareFile=null,shareP=null;
function prepShare(){
  if(shareP)return shareP;
  shareP=fetch(SHARE_IMG).then(r=>r.blob()).then(b=>createImageBitmap(b)).then(bm=>{
    const c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);
    return new Promise((ok,ko)=>c.toBlob(x=>x?ok(x):ko(),'image/png'));
  }).then(png=>{shareBlob=png;try{shareFile=new File([png],'rolopro.png',{type:'image/png'})}catch(e){}return png});
  shareP.catch(()=>{});return shareP;
}
setTimeout(prepShare,600);
function sendWA(n,text){
  const msg=(text.trim()?text.trim()+'\n':'')+PROMO;
  if(isIOS){
    /* iPhone: copy the image first (same as desktop), then open the chat with this number directly. */
    const go=()=>{location.href='https://wa.me/'+n+'?text='+encodeURIComponent(msg)};
    let started=false;
    try{
      if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
        const pr=shareBlob?Promise.resolve(shareBlob):prepShare();
        navigator.clipboard.write([new ClipboardItem({'image/png':pr})])
          .then(()=>{toast(t('copiedM'),6000);setTimeout(go,700)})
          .catch(()=>{toast(t('copyFail'),6000);setTimeout(go,700)});
        started=true;
      }
    }catch(e){}
    if(!started){toast(t('noCopy'),6000);setTimeout(go,700)}
    return;
  }
  if(isMobile){
    const canFile=shareFile&&navigator.share&&navigator.canShare&&navigator.canShare({files:[shareFile]});
    if(canFile){navigator.share({files:[shareFile],text:msg}).catch(e=>{if(e&&e.name==='AbortError')return;openWA(n,msg)});return}
    prepShare();openWA(n,msg);return;
  }
  let wrote=false;
  try{
    if(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem){
      const pr=shareBlob?Promise.resolve(shareBlob):prepShare();
      navigator.clipboard.write([new ClipboardItem({'image/png':pr})]).then(()=>toast(t('copied'),6000)).catch(()=>toast(t('copyFail'),6000));
      wrote=true;
    }
  }catch(e){}

/* ----- geometry ----- */
function measure(){const d=$('desk');DW=d.clientWidth||innerWidth;DH=d.clientHeight||innerHeight;const b=document.querySelector('.dbar');BAR=b&&d.clientWidth?Math.round(b.getBoundingClientRect().bottom-8):58;$('dHint').style.top=(BAR+4)+'px';

    s.querySelector('.rl-n').textContent=`${i+1}/${REELS.length}`+(i<REELS.length-1?' · '+t('reelsSwipe'):'');
    s.querySelector('.rl-h').textContent=t(rlMuted?'reelsTapSound':'reelsTapMute');
    s.querySelector('.rl-mute').textContent=rlMuted?'🔇':'🔊';
    if(e&&!e.hidden)e.textContent=t('reelsUnavail');
    if(v)v.setAttribute('aria-label',rlCap(r))})}
function reelsBuild(){
  rlS.innerHTML='';
  REELS.forEach((r,i)=>{const s=document.createElement('section');s.className='rl-item';s.dataset.i=i;
    const cap='<div class="rl-cap"><span class="rl-n"></span><b class="rl-t"></b><span class="rl-h"></span></div>';
    {s.innerHTML='<video class="rl-v" loop muted playsinline preload="none"></video><div class="rl-mute" aria-hidden="true"></div><div class="rl-err" hidden></div>'+cap;s.querySelector('video').setAttribute('webkit-playsinline','')}
    rlS.append(s)});
  reelsLang()}
function rlPlay(v,i){
  const r=REELS[i],e=v.closest('.rl-item').querySelector('.rl-err');
  if(!r.src){e.hidden=false;e.textContent=t('reelsUnavail');return}
  if(!v.getAttribute('src')){v.onerror=()=>{e.hidden=false;e.textContent=t('reelsUnavail')};v.onplaying=()=>{e.hidden=true};v.src=r.src}
  v.muted=rlMuted;v.loop=!rlAuto;
  const p=v.play();
  if(p&&p.catch)p.catch(()=>{if(!v.muted){v.muted=true;rlMuted=true;reelsLang();v.play().catch(()=>{})}})}
function rlObserve(){
  if(rlIO)rlIO.disconnect();
  rlIO=new IntersectionObserver(es=>es.forEach(en=>{const it=en.target,v=it.querySelector('video'),vis=en.isIntersecting&&en.intersectionRatio>=.6;
    if(vis){rlCur=+it.dataset.i;$('rlSel').value=rlCur}
    if(vis)rlPlay(v,rlCur);else v.pause()}),{root:rlS,threshold:[0,.6,1]});
  rlS.querySelectorAll('.rl-item').forEach(s=>rlIO.observe(s))}
function reelsUnload(){
  if(rlIO){rlIO.disconnect();rlIO=null}
  rlS.querySelectorAll('video').forEach(v=>{v.pause();v.onerror=v.onplaying=null;v.removeAttribute('src');try{v.load()}catch(e){}});
  rlS.innerHTML=''}
$('reels').onclick=()=>{bamboo();rlMuted=true;rlAuto=false;rlCur=0;reelsBuild();rlD.showModal();rlS.scrollTop=0;rlObserve();rlS.focus({preventScroll:true})};
$('rlX').onclick=()=>rlD.close();
$('rlAuto').onclick=()=>{rlAuto=!rlAuto;rlS.querySelectorAll('video').forEach(v=>v.loop=!rlAuto);reelsLang();
  const v=rlS.querySelector('.rl-item[data-i="'+rlCur+'"] video');if(rlAuto&&v&&v.ended)rlGo(1)};
rlS.addEventListener('ended',e=>{if(rlAuto&&e.target.closest('.rl-item').dataset.i==rlCur)rlGo(1)},true);
rlS.addEventListener('error',e=>{if(rlAuto&&e.target.closest&&e.target.closest('.rl-item')&&e.target.closest('.rl-item').dataset.i==rlCur)setTimeout(()=>{if(rlAuto)rlGo(1)},1500)},true);
function rlTo(i){const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;rlS.scrollTo({top:i*rlS.clientHeight,behavior:rm?'auto':'smooth'})}
function rlGo(d){const n=REELS.length;if(n<2)return;rlTo((rlCur+d+n)%n)}
$('rlSel').onchange=e=>{rlTo(+e.target.value);rlS.focus({preventScroll:true})};
function rlFwd(){const v=rlS.querySelector('.rl-item[data-i="'+rlCur+'"] video');if(!v||!v.getAttribute('src'))return;const d=v.duration;let n=v.currentTime+10;if(isFinite(d)&&n>=d-.5)n=0;v.currentTime=n;if(v.paused)v.play().catch(()=>{})}
$('rlPrev').onclick=()=>rlGo(-1);$('rlNext').onclick=()=>rlGo(1);function rlRew(){const v=rlS.querySelector('.rl-item[data-i="'+rlCur+'"] video');if(!v||!v.getAttribute('src'))return;v.currentTime=Math.max(0,v.currentTime-10);if(v.paused)v.play().catch(()=>{})}
$('rlFf').onclick=rlFwd;$('rlRw').onclick=rlRew;
rlD.addEventListener('keydown',e=>{if(e.target===$('rlSel'))return;const k=e.key;if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'){e.preventDefault();rlGo(1)}else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();rlGo(-1)}});
rlD.addEventListener('close',reelsUnload);
rlD.addEventListener('click',e=>{if(e.target===rlD)rlD.close()});
rlS.addEventListener('click',e=>{const s=e.target.closest('.rl-item');if(!s)return;
  const v=s.querySelector('video');if(!v)return;rlMuted=!rlMuted;v.muted=rlMuted;reelsLang()});
document.addEventListener('visibilitychange',()=>{if(!rlD.open)return;if(document.hidden)rlS.querySelectorAll('video').forEach(v=>v.pause());else rlObserve()});

build();applyLang();

/* ---------- Plastic cover: any click, tap or key removes it ---------- */
(()=>{const cv=$('cover');if(!cv)return;let gone=false;
  const peel=e=>{if(gone)return;gone=true;
    if(e&&e.type!=='keydown'&&!(e.target&&e.target.closest&&e.target.closest('button,a,input,select,textarea,summary,label'))){e.stopPropagation();e.preventDefault&&e.preventDefault();
      document.addEventListener('click',x=>{x.stopPropagation();x.preventDefault()},{capture:true,once:true})}
    ['pointerdown','keydown'].forEach(ev=>document.removeEventListener(ev,peel,true));
    bamboo(1.2);cv.parentNode.classList.remove('covered');cv.classList.add('off');setTimeout(()=>cv.remove(),600)};
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,peel,true))})();
</script>
</body>
</html>
